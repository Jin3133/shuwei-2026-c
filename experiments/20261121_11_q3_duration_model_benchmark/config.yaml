experiment_id: 20261121_11_q3_duration_model_benchmark
purpose: Compare a small set of established tree ensembles for prefix-specific duration prediction without expanding the final model stack.
source: work/incoming/model_delivery_20261120/model-delivery/q3_prefix_features.parquet
official_records: work/official_index_audit/official_records.csv
train_split: train
evaluation_split: validation
prefixes_s: [0.2, 0.6, 1.0]
quantiles: [0.5, 0.8]
n_group_folds: 4
excluded: [prefix_id, segment_id, episode_uuid, dataset, split, target_duration_s, prefix_duration_s, family_id]
models:
  gradient_boosting:
    n_estimators: 200
    learning_rate: 0.03
    max_depth: 2
    min_samples_leaf: 10
    subsample: 0.8
    random_state: 2026
  random_forest:
    n_estimators: 400
    min_samples_leaf: 5
    max_features: 0.8
    random_state: 2026
    n_jobs: -1
  extra_trees:
    n_estimators: 400
    min_samples_leaf: 5
    max_features: 0.8
    random_state: 2026
    n_jobs: -1
